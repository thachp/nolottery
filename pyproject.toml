[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nolottery"
version = "0.1.0"
description = "Washington Lottery expected-value analysis console app."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
lottery = "nolottery.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nolottery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
